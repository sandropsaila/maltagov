<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Government of Malta — Structure Register</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--ink:#1a1f1c;--paper:#f7f5ef;--card:#ffffff;--line:#dcd8c8;--malta-red:#a3172e;--malta-red-deep:#7d1122;--gold:#a1893f;--muted:#6b6a5f;--known:#2f5233;--known-bg:#e7efe4;--pending-bg:#f1efe4;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
header{padding:64px 24px 40px;text-align:center;border-bottom:1px solid var(--line);background:radial-gradient(circle at 15% 20%,rgba(163,23,46,.05),transparent 45%),radial-gradient(circle at 85% 10%,rgba(161,137,63,.07),transparent 40%);}
header .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--malta-red);margin-bottom:14px;}
header h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(32px,5vw,56px);margin:0 0 12px;letter-spacing:-.01em;}
header p.sub{color:var(--muted);max-width:560px;margin:0 auto;font-size:15px;}
.cross{display:inline-block;width:22px;height:22px;margin-right:8px;vertical-align:-4px;background:linear-gradient(var(--malta-red),var(--malta-red)) 50% 0/34% 100% no-repeat,linear-gradient(var(--malta-red),var(--malta-red)) 0 50%/100% 34% no-repeat;}
.meta-bar{max-width:920px;margin:28px auto 0;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.meta-bar strong{color:var(--ink);font-weight:600;}
.search-wrap{max-width:640px;margin:32px auto 0;padding:0 24px;}
#search{width:100%;padding:14px 18px;font-size:15px;border:1px solid var(--line);border-radius:2px;background:var(--card);font-family:'IBM Plex Sans',sans-serif;outline:none;}
#search:focus{border-color:var(--malta-red);}
main{max-width:920px;margin:0 auto;padding:40px 24px 100px;}
.ministry{margin-bottom:14px;border:1px solid var(--line);background:var(--card);}
.ministry-head{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:16px 18px;cursor:pointer;user-select:none;flex-wrap:wrap;}
.ministry-head:hover{background:#fbfaf5;}
.ministry-title{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;min-width:0;flex:1 1 220px;}
.abbr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--malta-red);border:1px solid var(--malta-red);padding:2px 6px;letter-spacing:.05em;flex-shrink:0;}
.rank-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);font-weight:600;flex-shrink:0;min-width:20px;}
.ministry-title h2{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0;line-height:1.3;min-width:0;}
.minister-name{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;}
.pct-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 8px;border-radius:2px;white-space:nowrap;letter-spacing:.02em;flex-shrink:0;}
.pct-zero{background:#f1e3e3;color:var(--malta-red-deep);}
.pct-low{background:#f3ead6;color:#8a6a1f;}
.pct-mid{background:#eef0e0;color:#5a6b3d;}
.pct-full{background:var(--known-bg);color:var(--known);}
.head-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}
.count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
.chev{transition:transform .2s;color:var(--muted);font-size:13px;flex-shrink:0;}
.ministry.open .chev{transform:rotate(90deg);}
@media (max-width:480px){.ministry-title h2{font-size:14.5px;}.count{display:none;}.ministry-head{padding:13px 14px;}header{padding:48px 16px 32px;}main{padding:28px 14px 80px;}}
.entities{display:none;border-top:1px solid var(--line);}
.ministry.open .entities{display:block;}
.type-table-wrap{padding:16px 22px 8px;border-bottom:1px solid #eeecdf;}
table.type-table{border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px;width:100%;max-width:420px;}
table.type-table th{text-align:left;color:var(--muted);font-weight:500;padding:4px 14px 6px 0;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;}
table.type-table td{padding:4px 14px 4px 0;color:var(--ink);}
table.type-table td:last-child,table.type-table th:last-child{text-align:right;padding-right:0;}
table.type-table tr:not(:last-child) td{border-bottom:1px solid #f1efe4;}
.entity{display:flex;flex-direction:column;gap:6px;padding:12px 22px;border-bottom:1px solid #eeecdf;font-size:14px;}
.entity:last-child{border-bottom:none;}
.entity-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.entity-name{flex:1;min-width:0;}
.entity-type{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.chair-tag{font-size:11px;white-space:nowrap;padding:3px 8px;border-radius:2px;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
.chair-pending{background:var(--pending-bg);color:var(--muted);}
.chair-noinfo{background:transparent;color:var(--muted);border:1px dashed var(--muted);}
.contact-block{background:var(--known-bg);border-radius:2px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;}
.contact-name{font-size:13.5px;color:var(--known);font-weight:600;}
.contact-clickable{cursor:pointer;}
.contact-clickable:hover{background:#dcead6;}
.contact-clickable .contact-name{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.contact-title{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--known);text-transform:uppercase;letter-spacing:.05em;opacity:.8;}
.members-block{background:#f6f5ee;border-radius:2px;padding:8px 12px;font-size:12.5px;}
.members-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.members-list{color:var(--ink);line-height:1.5;}
.member-link{color:var(--malta-red);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;cursor:pointer;}
.member-link:hover{color:var(--malta-red-deep);}
.bios-block{display:flex;flex-direction:column;gap:8px;}
.bio-item{font-size:12.5px;color:var(--muted);line-height:1.6;background:#faf9f4;border-left:2px solid var(--gold);padding:8px 12px;}
.bio-name{color:var(--ink);font-weight:600;}
.legend{max-width:920px;margin:0 auto;padding:0 24px;display:flex;gap:18px;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-bottom:20px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.known{background:var(--known);}
.dot.pending{background:var(--gold);}
.dot.noinfo{background:transparent;border:1px dashed var(--muted);}
footer{text-align:center;padding:40px 24px 60px;color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',monospace;border-top:1px solid var(--line);}
footer a{color:var(--malta-red);}
.hidden{display:none!important;}
.people-toggle-wrap{max-width:920px;margin:20px auto 0;padding:0 24px;}
#peopleToggle{width:100%;text-align:left;padding:12px 16px;background:var(--card);border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);cursor:pointer;border-radius:2px;}
#peopleToggle:hover{background:#fbfaf5;}
.jump-link-wrap{margin-top:16px;}
.jump-link{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--malta-red);cursor:pointer;border-bottom:1px solid var(--malta-red);padding-bottom:2px;}
.jump-link:hover{color:var(--malta-red-deep);border-color:var(--malta-red-deep);}
.people-directory{max-width:920px;margin:10px auto 0;padding:0 24px 20px;}
table.people-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);}
table.people-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#fbfaf5;}
table.people-table td{padding:8px 10px;border-bottom:1px solid #f1efe4;vertical-align:top;}
table.people-table tr:last-child td{border-bottom:none;}
.bio-no{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.bio-link{color:var(--malta-red);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;border-bottom:1px solid var(--malta-red);white-space:nowrap;}
.bio-link:hover{color:var(--malta-red-deep);border-color:var(--malta-red-deep);}
.bio-item.flash{animation:flashHighlight 1.8s ease;}
.bio-source{margin-top:6px;font-size:10.5px;}
.bio-source a{color:var(--gold);word-break:break-all;}
@keyframes flashHighlight{0%{background:#f3ead6;}100%{background:#faf9f4;}}
.li-pending{color:var(--muted);}
.source-link{color:var(--gold);font-size:11px;}
.people-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
@media (max-width:640px){table.people-table{font-size:11.5px;}table.people-table th,table.people-table td{padding:6px 6px;}}
#loadingMsg{text-align:center;padding:80px 24px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
</style></head><body>
<div id="loadingMsg">Loading Malta government structure register…</div>
<div id="app" class="hidden"></div>
<script>
const ROLE_LABELS = {chairman:'Chairman',chairperson:'Chairperson',executive_chairman:'Executive Chairman',ceo:'CEO',coo:'Chief Operating Officer',planning_board_chairman:'Planning Board Chairman',board_secretary:'Board Secretary',deputy_chairman:'Deputy Chairman',deputy_chairperson:'Deputy Chairperson'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function bioHref(entity,person,bioEntity){return 'bios/'+slug(bioEntity||entity)+'-'+slug(person)+'.html';}
function findChair(chairs,name){return chairs[name]||null;}

function render(data){
  const ministries = data.ministries, chairs = data.chairs;
  let totalEntities=0, totalChairs=0;
  const mHtml = [];
  const people = [];

  const scored = ministries.map(m=>{
    const n = m.entities.length;
    let found=0;
    m.entities.forEach(([name])=>{ if(chairs[name]) found++; });
    return {m, n, found, pct: n? Math.round(found/n*100):0};
  }).sort((a,b)=>b.pct-a.pct);

  scored.forEach((s,idx)=>{
    const m=s.m, n=s.n, found=s.found, pct=s.pct;
    totalEntities+=n; totalChairs+=found;
    let pctClass='pct-zero';
    if(pct===100) pctClass='pct-full'; else if(pct>=50) pctClass='pct-mid'; else if(pct>0) pctClass='pct-low';
    const typeCounts={};
    m.entities.forEach(([,t])=>{typeCounts[t]=(typeCounts[t]||0)+1;});
    const typeRows = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<tr><td>${esc(t)}</td><td>${c}</td></tr>`).join('');

    const entityHtml = m.entities.map(([name,etype])=>{
      const chair = findChair(chairs,name);
      if(!chair){
        return `<div class="entity" data-search="${esc(name.toLowerCase())}"><div class="entity-top"><div class="entity-name">${esc(name)}<span class="entity-type">${esc(etype)}</span></div><div class="chair-tag chair-pending">pending</div></div></div>`;
      }
      const bios = chair.bios||{};
      const bioSrc = chair.bio_sources||{};
      let contacts=[];
      Object.keys(ROLE_LABELS).forEach(k=>{
        const v = chair[k];
        if(v && !String(v).includes('UNCONFIRMED') && !String(v).includes('NEEDS')) contacts.push([ROLE_LABELS[k], v]);
      });
      let contactHtml;
      if(contacts.length){
        contactHtml = contacts.map(([label,val])=>{
          const matched = Object.keys(bios).find(b=>val.includes(b)||b.includes(val));
          if(matched){
            const href = bioHref(name,matched,chair.bio_entity);
            return `<a class="contact-block contact-clickable" href="${href}"><div class="contact-name">${esc(val)}</div><div class="contact-title">${esc(label)}</div></a>`;
          }
          return `<div class="contact-block"><div class="contact-name">${esc(val)}</div><div class="contact-title">${esc(label)}</div></div>`;
        }).join('');
      } else if(chair.no_info_found){
        contactHtml = `<div class="chair-tag chair-noinfo" style="align-self:flex-start;">no info found</div>`;
      } else {
        contactHtml = `<div class="chair-tag chair-pending" style="align-self:flex-start;">under verification</div>`;
      }
      let membersHtml='';
      if(chair.board_members && chair.board_members.length){
        const memberLinks = chair.board_members.map(member=>{
          const matched = Object.keys(bios).find(b=>member.includes(b)||b.includes(member));
          if(matched){
            return `<a class="member-link" href="${bioHref(name,matched,chair.bio_entity)}">${esc(member)}</a>`;
          }
          return esc(member);
        }).join(', ');
        membersHtml = `<div class="members-block"><div class="members-label">Other board members</div><div class="members-list">${memberLinks}</div></div>`;
      }
      contacts.forEach(([label,val])=>{
        const matched = Object.keys(bios).find(b=>val.includes(b)||b.includes(val));
        people.push({name:val, position:label, entity:name, href: matched?bioHref(name,matched,chair.bio_entity):null, source: matched?bioSrc[matched]:null});
      });
      (chair.board_members||[]).forEach(member=>{
        const matched = Object.keys(bios).find(b=>member.includes(b)||b.includes(member));
        people.push({name:member, position:'Board Member', entity:name, href: matched?bioHref(name,matched,chair.bio_entity):null, source: matched?bioSrc[matched]:null});
      });

      return `<div class="entity" data-search="${esc(name.toLowerCase())}"><div class="entity-top"><div class="entity-name">${esc(name)}<span class="entity-type">${esc(etype)}</span></div></div>${contactHtml}${membersHtml}</div>`;
    }).join('');

    mHtml.push(`<div class="ministry" data-search="${esc(m.name.toLowerCase())}"><div class="ministry-head" onclick="this.parentElement.classList.toggle('open')"><div class="ministry-title"><span class="rank-num">${String(idx+1).padStart(2,'0')}</span><span class="abbr">${esc(m.abbr)}</span><div><h2>${esc(m.name)}</h2>${m.minister?`<div class="minister-name">Minister: ${esc(m.minister)}</div>`:''}</div><span class="pct-badge ${pctClass}">${pct}% complete</span></div><div class="head-right"><span class="count">${found}/${n} found</span><span class="chev">▸</span></div></div><div class="entities"><div class="type-table-wrap"><table class="type-table"><thead><tr><th>Type</th><th>Count</th></tr></thead><tbody>${typeRows}</tbody></table></div>${entityHtml}</div></div>`);
  });

  people.sort((a,b)=>a.name.localeCompare(b.name));
  const peopleRows = people.map(p=>{
    const bioCell = p.href ? `<a class="bio-link" href="${p.href}">Read bio →</a>` : `<span class="bio-no">pending</span>`;
    const srcCell = p.source ? `<a href="${esc(p.source)}" target="_blank" rel="noopener" class="source-link">link ↗</a>` : `<span class="li-pending">—</span>`;
    return `<tr><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${esc(p.entity)}</td><td>${bioCell}</td><td>${srcCell}</td></tr>`;
  }).join('');

  const html = `
<header><div class="eyebrow">Government of Malta — Working Register</div><h1><span class="cross"></span>Ministries &amp; Entities</h1><p class="sub">A structured map of Malta's ministries and their officially appointed bodies, built from the Malta Data Portal's live administrative register, cross-checked against ministry and news sources. Current administration only.</p><div class="meta-bar"><span><strong>${ministries.length}</strong> ministries mapped</span><span><strong>${totalEntities}</strong> entities identified</span><span><strong>${totalChairs}</strong> chairs confirmed</span><span>Last updated <strong>${esc(data.updated)}</strong></span></div><div class="jump-link-wrap"><span class="jump-link" role="link" tabindex="0" onclick="showPeople()">↓ Jump to People Directory (${people.length} people)</span></div></header>
<div class="search-wrap"><input id="search" type="text" placeholder="Search a ministry or entity…" oninput="filterList()"></div>
<div class="legend" style="margin-top:24px;"><span><i class="dot known"></i>Chair/CEO confirmed</span><span><i class="dot noinfo"></i>Searched — no info found</span><span><i class="dot pending"></i>Not yet researched</span></div>
<div class="people-toggle-wrap"><button id="peopleToggle" onclick="togglePeople()">☰ People Directory (${people.length} individuals identified)</button></div>
<div id="peopleDirectory" class="people-directory hidden"><table class="people-table"><thead><tr><th>Name</th><th>Position</th><th>Entity</th><th>Bio</th><th>Source</th></tr></thead><tbody>${peopleRows}</tbody></table><p class="people-note">Source links point to the specific article, profile, or official page each bio was researched from — mainly LinkedIn, maltaceos.mt, and official entity websites. Left blank where no bio has been researched yet.</p></div>
<main id="list">${mHtml.join('')}</main>
<footer>Sources: Malta Data Portal (data.gov.mt AdminRegister API) · gov.mt Ministries &amp; Entities · Wikipedia · TVM News · Newsbook.<br>This is a living document — say "update searches" to check for changes since last review.</footer>`;
  document.getElementById('app').innerHTML = html;
}

function filterList(){
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.ministry').forEach(min=>{
    const minMatch = min.dataset.search.includes(q);
    let anyEntity=false;
    min.querySelectorAll('.entity').forEach(e=>{
      const match = e.dataset.search.includes(q) || minMatch;
      e.classList.toggle('hidden', !match);
      if(match) anyEntity=true;
    });
    min.classList.toggle('hidden', q.length>0 && !anyEntity && !minMatch);
    if(q.length>0 && anyEntity) min.classList.add('open');
    if(q.length===0) min.classList.remove('open');
  });
}
function togglePeople(){document.getElementById('peopleDirectory').classList.toggle('hidden');}
function showPeople(){document.getElementById('peopleDirectory').classList.remove('hidden');document.getElementById('peopleDirectory').scrollIntoView({behavior:'smooth',block:'start'});}

fetch('/data.json').then(r=>r.json()).then(data=>{
  document.getElementById('loadingMsg').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render(data);
}).catch(e=>{
  document.getElementById('loadingMsg').textContent = 'Failed to load data: '+e;
});
</script>
</body></html>
