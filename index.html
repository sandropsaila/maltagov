<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Government of Malta — Structure Register</title><style>

table.people-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#fbfaf5;}

.deloitte-no-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}

.deloitte-filter-wrap input{cursor:pointer;}
.deloitte-filter-wrap label{cursor:pointer;}
.li-yes-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#0a5c8a;background:#e3eef8;border:1px solid #0a5c8a;padding:2px 7px;border-radius:2px;white-space:nowrap;text-decoration:none;}
.li-no-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}
@media (max-width:640px){table.people-table{font-size:11.5px;}table.people-table th,table.people-table td{padding:6px 6px;}}
#loadingMsg{text-align:center;padding:80px 24px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
#pinGate{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;}
#pinGate .gateCard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:40px 36px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.08);}
#pinGate h2{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin:0 0 8px;color:var(--ink);}
#pinGate p{color:var(--muted);font-size:14px;margin:0 0 22px;}
#pinGate input{width:100%;box-sizing:border-box;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.4em;text-align:center;padding:12px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
#pinGate input:focus{outline:none;border-color:var(--malta-red);}
#pinGate button{margin-top:14px;width:100%;padding:11px;border:none;border-radius:6px;background:var(--malta-red);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
#pinGate button:hover{background:var(--malta-red-deep);}

body.gate-locked #loadingMsg,body.gate-locked #app{display:none!important;}
</style></head><body>
<div id="pinGate">
  <div class="gateCard">
    <h2>Restricted Access</h2>
    <p>Enter PIN to access.</p>
    <form id="pinForm" autocomplete="off">
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus>
      <div class="gateError" id="gateError"></div>
    </form>
  </div>
</div>
<div id="loadingMsg">Loading Malta government structure register…</div>
<div id="app" class="hidden"></div>
<script>
(function(){
  var CORRECT_PIN='1122';
  var gate=document.getElementById('pinGate');
  var form=document.getElementById('pinForm');
  var input=document.getElementById('pinInput');
  var err=document.getElementById('gateError');
  if(sessionStorage.getItem('mgsr_gate_ok')==='1'){
    gate.style.display='none';
  } else {
    document.body.classList.add('gate-locked');
  }
  form.addEventListener('submit',function(e){ e.preventDefault(); });
  input.addEventListener('input',function(){
    if(input.value.length===4){
      if(input.value===CORRECT_PIN){
        sessionStorage.setItem('mgsr_gate_ok','1');
        gate.style.display='none';
        document.body.classList.remove('gate-locked');
      } else {
        err.textContent='Incorrect PIN. Please try again.';
        input.value='';
        input.focus();
      }
    }
  });
})();
const ROLE_LABELS = {chairman:'Chairman',chairperson:'Chairperson',executive_chairman:'Executive Chairman',ceo:'CEO',coo:'Chief Operating Officer',planning_board_chairman:'Planning Board Chairman',board_secretary:'Board Secretary',deputy_chairman:'Deputy Chairman',deputy_chairperson:'Deputy Chairperson',director:'Director',vice_chairman:'Vice Chairman',president:'President',director_general:'Director General',treasurer:'Treasurer'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function bioHref(entity,person,bioEntity){return 'bios/'+slug(bioEntity||entity)+'-'+slug(person)+'.html';}
function findChair(chairs,name){return chairs[name]||null;}
function findDeloitte(chair,personName){
  const map = chair.bio_deloitte||{};
  const matched = Object.keys(map).find(b=>personName.includes(b)||b.includes(personName));
  return matched ? map[matched] : null;
}
function findLinkedIn(chair,personName){
  const map = chair.bio_linkedin||{};
  const matched = Object.keys(map).find(b=>personName.includes(b)||b.includes(personName));
  if(!matched) return undefined;
  return map[matched];
}

function render(data){
  const ministries = data.ministries, chairs = data.chairs;
  let totalEntities=0, totalChairs=0;
  const mHtml = [];
  const people = [];
  const peopleSeen = new Set();
  function pushPerson(p){
    const key = slug(p.name)+'|'+slug(p.position)+'|'+slug(p.entity);
    if(peopleSeen.has(key)) return;
    peopleSeen.add(key);
    people.push(p);
  }

  const scored = ministries.map(m=>{
    const n = m.entities.length;
    let found=0;
    m.entities.forEach(([name])=>{
      const c = chairs[name];
      if(!c) return;
      const hasChairInfo = Object.keys(ROLE_LABELS).some(k=>c[k]) || c.no_info_found;
      if(hasChairInfo) found++;
    });
    return {m, n, found, pct: n? Math.round(found/n*100):0};
  }).sort((a,b)=>b.pct-a.pct);

  scored.forEach((s,idx)=>{
    const m=s.m, n=s.n, found=s.found, pct=s.pct;
    totalEntities+=n; totalChairs+=found;
    let pctClass='pct-zero';
    if(pct===100) pctClass='pct-full'; else if(pct>=50) pctClass='pct-mid'; else if(pct>0) pctClass='pct-low';
    const typeCounts={};
    m.entities.forEach(([,t])=>{typeCounts[t]=(typeCounts[t]||0)+1;});
    const typeRows = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<tr><td>${esc(t)}</td><td>${c}</td></tr>`).join('');

    const entityHtml = m.entities.map(([name,etype])=>{
      const chair = findChair(chairs,name);
      if(!chair){
        return `<div class="entity" data-search="${esc((name+' '+etype).toLowerCase())}"><div class="entity-top"><div class="entity-name">${esc(name)}<span class="entity-type">${esc(etype)}</span></div><div class="chair-tag chair-pending">pending</div></div></div>`;
      }
      const bios = chair.bios||{};
      const bioSrc = chair.bio_sources||{};
      const websiteHtml = chair.website ? `<a class="website-link" href="${esc(chair.website)}" target="_blank" rel="noopener">Official website ↗</a>` : (chair.website_note ? `<span class="website-none" title="${esc(chair.website_note)}">No official webpage found</span>` : '');
      let contacts=[];
      Object.keys(ROLE_LABELS).forEach(k=>{
        const v = chair[k];
        if(v && !String(v).includes('UNCONFIRMED') && !String(v).includes('NEEDS')) contacts.push([ROLE_LABELS[k], v, null]);
      });
      (chair.related_officials||[]).forEach(ro=>{
        contacts.push([ro.role, ro.name, ro.href||null]);
      });
      let contactHtml;
      if(contacts.length){
        contactHtml = contacts.map(([label,val,explicitHref])=>{
          const matched = Object.keys(bios).find(b=>val.includes(b)||b.includes(val));
          const href = explicitHref || (matched ? bioHref(name,matched,chair.bio_entity) : null);
          if(href){
            return `<a class="contact-block contact-clickable" href="${href}"><div class="contact-name">${esc(val)}</div><div class="contact-title">${esc(label)}</div></a>`;
          }
          return `<div class="contact-block"><div class="contact-name">${esc(val)}</div><div class="contact-title">${esc(label)}</div></div>`;
        }).join('');
      } else if(chair.no_info_found){
        contactHtml = `<div class="chair-tag chair-noinfo" style="align-self:flex-start;">no info found</div>`;
      } else {
        contactHtml = `<div class="chair-tag chair-pending" style="align-self:flex-start;">under verification</div>`;
      }
      let membersHtml='';
      if(chair.board_members && chair.board_members.length){
        const memberLinks = chair.board_members.map(member=>{
          const matched = Object.keys(bios).find(b=>member.includes(b)||b.includes(member));
          if(matched){
            return `<a class="member-link" href="${bioHref(name,matched,chair.bio_entity)}">${esc(member)}</a>`;
          }
          return esc(member);
        }).join(', ');
        membersHtml = `<div class="members-block"><div class="members-label">Other board members</div><div class="members-list">${memberLinks}</div></div>`;
      } else if(chair.composition_note){
        const compSourceHtml = chair.composition_note_source ? ` <a href="${esc(chair.composition_note_source)}" target="_blank" rel="noopener" class="composition-source-link">source ↗</a>` : '';
        membersHtml = `<div class="members-block"><div class="members-label">Committee composition</div><div class="members-list">${esc(chair.composition_note)}${compSourceHtml}</div></div>`;
      }
      const canonicalEntity = chair.bio_entity || name;
      contacts.forEach(([label,val,explicitHref])=>{
        const matched = Object.keys(bios).find(b=>val.includes(b)||b.includes(val));
        const href = explicitHref || (matched ? bioHref(name,matched,chair.bio_entity) : null);
        pushPerson({name:val, position:label, entity:canonicalEntity, href: href, source: matched?bioSrc[matched]:null, deloitte: findDeloitte(chair,val), linkedin: findLinkedIn(chair,val)});
      });
      (chair.board_members||[]).forEach(member=>{
        const matched = Object.keys(bios).find(b=>member.includes(b)||b.includes(member));
        pushPerson({name:member, position:'Board Member', entity:canonicalEntity, href: matched?bioHref(name,matched,chair.bio_entity):null, source: matched?bioSrc[matched]:null, deloitte: findDeloitte(chair,member), linkedin: findLinkedIn(chair,member)});
      });

      const entityNameHtml = chair.govbody_page ? `<a class="entity-name-link" href="${esc(chair.govbody_page)}">${esc(name)}</a>` : esc(name);
      const searchBits = [name, etype, ...contacts.map(c=>c[1]), ...(chair.board_members||[])].join(' ').toLowerCase();
      return `<div class="entity" data-search="${esc(searchBits)}"><div class="entity-top"><div class="entity-name">${entityNameHtml}<span class="entity-type">${esc(etype)}</span></div></div>${websiteHtml}${contactHtml}${membersHtml}</div>`;
    }).join('');

    const ministerHtml = m.minister ? (m.minister_bio ? `<a class="minister-name minister-link" href="${esc(m.minister_bio)}">Minister: ${esc(m.minister)}</a>` : `<div class="minister-name">Minister: ${esc(m.minister)}</div>`) : '';
    const psHtml = m.permanent_secretary ? (m.permanent_secretary_bio ? `<a class="minister-name minister-link" href="${esc(m.permanent_secretary_bio)}">Permanent Secretary: ${esc(m.permanent_secretary)}</a>` : `<div class="minister-name">Permanent Secretary: ${esc(m.permanent_secretary)}</div>`) : '';
    mHtml.push(`<div class="ministry" data-search="${esc(m.name.toLowerCase())}"><div class="ministry-head" onclick="this.parentElement.classList.toggle('open')"><div class="ministry-title"><span class="rank-num">${String(idx+1).padStart(2,'0')}</span><span class="abbr">${esc(m.abbr)}</span><div><h2>${esc(m.name)}</h2>${ministerHtml}${psHtml}</div></div><div class="head-right"><span class="count">${found}/${n} found</span><span class="chev">▸</span></div></div><div class="entities"><div class="type-table-wrap"><table class="type-table"><thead><tr><th>Type</th><th>Count</th></tr></thead><tbody>${typeRows}</tbody></table></div>${entityHtml}</div></div>`);
  });

  people.sort((a,b)=>a.name.localeCompare(b.name));

  const html = `
<header><div class="eyebrow">Government of Malta</div><h1><span class="cross"></span>Ministries &amp; Entities</h1><p class="sub">A structured map of Malta's ministries and their officially appointed bodies, built from the Malta Data Portal's live administrative register, cross-checked against ministry and news sources. Current administration only.</p><div class="meta-bar"><span><strong>${ministries.length}</strong> ministries mapped</span><span><strong>${totalEntities}</strong> entities identified</span><span>Last updated <strong>${esc(data.updated)}</strong></span></div></header>
<div class="search-wrap"><div class="search-box"><input id="search" type="text" placeholder="Search a ministry, entity, or person… (press / to focus)" oninput="filterList()" autocomplete="off"><button id="searchClear" class="search-clear hidden" onclick="clearSearch()" aria-label="Clear search" type="button">×</button></div><div id="searchStatus" class="search-status hidden"></div></div>
<div class="people-toggle-wrap"><a id="peopleToggle" href="peopleregister.html">☰ People Directory (${people.length} individuals identified) ↗</a></div>
<main id="list">${mHtml.join('')}</main>
<footer>Sources: Malta Data Portal (data.gov.mt AdminRegister API) · gov.mt Ministries &amp; Entities · Wikipedia · TVM News · Newsbook.<br>This is a living document — say "update searches" to check for changes since last review.</footer>`;
  document.getElementById('app').innerHTML = html;
}

function filterList(){
  const input = document.getElementById('search');
  const q = input.value.toLowerCase().trim();
  document.getElementById('searchClear').classList.toggle('hidden', q.length===0);

  let totalMatches=0, ministriesShown=0;
  document.querySelectorAll('.ministry').forEach(min=>{
    const minMatch = min.dataset.search.includes(q);
    let anyEntity=false;
    min.querySelectorAll('.entity').forEach(e=>{
      const match = q.length===0 || e.dataset.search.includes(q) || minMatch;
      e.classList.toggle('hidden', !match);
      if(match){ anyEntity=true; if(q.length>0) totalMatches++; }
    });
    const minHidden = q.length>0 && !anyEntity && !minMatch;
    min.classList.toggle('hidden', minHidden);
    if(!minHidden) ministriesShown++;
    if(q.length>0 && anyEntity) min.classList.add('open');
    if(q.length===0) min.classList.remove('open');
  });

  const status = document.getElementById('searchStatus');
  let noResults = document.getElementById('noResults');
  if(q.length>0){
    status.classList.remove('hidden');
    status.textContent = ministriesShown===0 ? 'No matches' : `${totalMatches} ${totalMatches===1?'entity':'entities'} across ${ministriesShown} ${ministriesShown===1?'ministry':'ministries'}`;
    if(ministriesShown===0){
      if(!noResults){
        noResults = document.createElement('div');
        noResults.id = 'noResults';
        noResults.className = 'no-results';
        document.getElementById('list').before(noResults);
      }
      noResults.textContent = `No matches for "${input.value.trim()}" — try a ministry name, entity name, or a person's name.`;
    } else if(noResults){
      noResults.remove();
    }
  } else {
    status.classList.add('hidden');
    if(noResults) noResults.remove();
  }
}
function clearSearch(){
  const input = document.getElementById('search');
  input.value = '';
  filterList();
  input.focus();
}
document.addEventListener('keydown', e=>{
  const input = document.getElementById('search');
  if(!input) return;
  if(e.key==='/' && document.activeElement!==input){
    e.preventDefault();
    input.focus();
  } else if(e.key==='Escape' && document.activeElement===input){
    clearSearch();
  }
});
fetch('/data.json').then(r=>r.json()).then(data=>{
  document.getElementById('loadingMsg').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render(data);
}).catch(e=>{
  document.getElementById('loadingMsg').textContent = 'Failed to load data: '+e;
});
</script>
</body></html>
