<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>People Directory — Government of Malta Structure Register</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--ink:#1a1f1c;--paper:#f7f5ef;--card:#ffffff;--line:#dcd8c8;--malta-red:#a3172e;--malta-red-deep:#7d1122;--gold:#a1893f;--muted:#6b6a5f;--known:#2f5233;--known-bg:#e7efe4;--pending-bg:#f1efe4;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
header{padding:48px 24px 32px;text-align:center;border-bottom:1px solid var(--line);background:radial-gradient(circle at 15% 20%,rgba(163,23,46,.05),transparent 45%),radial-gradient(circle at 85% 10%,rgba(161,137,63,.07),transparent 40%);}
header .eyebrow{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--malta-red);margin-bottom:14px;}
header h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(28px,4.5vw,46px);margin:0 0 12px;letter-spacing:-.01em;}
header p.sub{color:var(--muted);max-width:560px;margin:0 auto;font-size:15px;}
.cross{display:inline-block;width:22px;height:22px;margin-right:8px;vertical-align:-4px;background:linear-gradient(var(--malta-red),var(--malta-red)) 50% 0/34% 100% no-repeat,linear-gradient(var(--malta-red),var(--malta-red)) 0 50%/100% 34% no-repeat;}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--malta-red);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12.5px;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .15s ease;}
.back:hover{border-bottom-color:var(--malta-red);}
.meta-bar{max-width:920px;margin:24px auto 0;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.meta-bar strong{color:var(--ink);font-weight:600;}
.people-directory{max-width:920px;margin:32px auto 0;padding:0 24px 60px;}
.people-search-wrap{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
#peopleSearch{flex:1;min-width:200px;padding:10px 14px;font-size:14px;border:1px solid var(--line);border-radius:2px;background:var(--card);font-family:'IBM Plex Sans',sans-serif;outline:none;}
#peopleSearch:focus{border-color:var(--malta-red);}
.people-count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap;}
table.people-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);}
table.people-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#fbfaf5;}
table.people-table td{padding:8px 10px;border-bottom:1px solid #f1efe4;vertical-align:top;}
table.people-table tr:last-child td{border-bottom:none;}
.bio-no{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.bio-link{color:var(--malta-red);font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;border-bottom:1px solid var(--malta-red);white-space:nowrap;text-decoration:none;}
.bio-link:hover{color:var(--malta-red-deep);border-color:var(--malta-red-deep);}
.deloitte-yes-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#0a5c36;background:#e1f2e8;border:1px solid #0a5c36;padding:2px 7px;border-radius:2px;white-space:nowrap;}
.deloitte-no-badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);}
.deloitte-filter-wrap{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
.deloitte-filter-wrap input{cursor:pointer;}
.deloitte-filter-wrap label{cursor:pointer;}
.li-pending{color:var(--muted);}
.people-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5;}
.hidden{display:none!important;}
@media (max-width:640px){table.people-table{font-size:11.5px;}table.people-table th,table.people-table td{padding:6px 6px;}}
#loadingMsg{text-align:center;padding:80px 24px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
#pinGate{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;}
#pinGate .gateCard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:40px 36px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.08);}
#pinGate h2{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin:0 0 8px;color:var(--ink);}
#pinGate p{color:var(--muted);font-size:14px;margin:0 0 22px;}
#pinGate input{width:100%;box-sizing:border-box;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.4em;text-align:center;padding:12px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
#pinGate input:focus{outline:none;border-color:var(--malta-red);}
#pinGate button{margin-top:14px;width:100%;padding:11px;border:none;border-radius:6px;background:var(--malta-red);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
#pinGate button:hover{background:var(--malta-red-deep);}
#pinGate .gateError{color:var(--malta-red);font-size:13px;margin-top:10px;min-height:16px;}
body.gate-locked #loadingMsg,body.gate-locked #app{display:none!important;}
footer{text-align:center;padding:40px 24px 60px;color:var(--muted);font-size:12px;font-family:'IBM Plex Mono',monospace;border-top:1px solid var(--line);}
footer a{color:var(--malta-red);}
</style></head><body>
<div id="pinGate">
  <div class="gateCard">
    <h2>Restricted Access</h2>
    <p>Enter PIN to access.</p>
    <form id="pinForm" autocomplete="off">
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus>
      <div class="gateError" id="gateError"></div>
    </form>
  </div>
</div>
<div id="loadingMsg">Loading Malta government People Directory…</div>
<div id="app" class="hidden"></div>
<script>
(function(){
  var CORRECT_PIN='1122';
  var gate=document.getElementById('pinGate');
  var form=document.getElementById('pinForm');
  var input=document.getElementById('pinInput');
  var err=document.getElementById('gateError');
  if(sessionStorage.getItem('mgsr_gate_ok')==='1'){
    gate.style.display='none';
  } else {
    document.body.classList.add('gate-locked');
  }
  form.addEventListener('submit',function(e){ e.preventDefault(); });
  input.addEventListener('input',function(){
    if(input.value.length===4){
      if(input.value===CORRECT_PIN){
        sessionStorage.setItem('mgsr_gate_ok','1');
        gate.style.display='none';
        document.body.classList.remove('gate-locked');
      } else {
        err.textContent='Incorrect PIN. Please try again.';
        input.value='';
        input.focus();
      }
    }
  });
})();
const ROLE_LABELS = {chairman:'Chairman',chairperson:'Chairperson',executive_chairman:'Executive Chairman',ceo:'CEO',coo:'Chief Operating Officer',planning_board_chairman:'Planning Board Chairman',board_secretary:'Board Secretary',deputy_chairman:'Deputy Chairman',deputy_chairperson:'Deputy Chairperson',director:'Director',vice_chairman:'Vice Chairman',president:'President',director_general:'Director General',treasurer:'Treasurer'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function bioHref(entity,person,bioEntity){return 'bios/'+slug(bioEntity||entity)+'-'+slug(person)+'.html';}
function findChair(chairs,name){return chairs[name]||null;}
function findDeloitte(chair,personName){
  const map = chair.bio_deloitte||{};
  const matched = Object.keys(map).find(b=>personName.includes(b)||b.includes(personName));
  return matched ? map[matched] : null;
}
function findLinkedIn(chair,personName){
  const map = chair.bio_linkedin||{};
  const matched = Object.keys(map).find(b=>personName.includes(b)||b.includes(personName));
  if(!matched) return undefined;
  return map[matched];
}

function buildPeople(data){
  const ministries = data.ministries, chairs = data.chairs;
  const people = [];
  const peopleSeen = new Set();
  function pushPerson(p){
    const key = slug(p.name)+'|'+slug(p.position)+'|'+slug(p.entity);
    if(peopleSeen.has(key)) return;
    peopleSeen.add(key);
    people.push(p);
  }
  ministries.forEach(m=>{
    m.entities.forEach(([name])=>{
      const chair = findChair(chairs,name);
      if(!chair) return;
      const bios = chair.bios||{};
      const bioSrc = chair.bio_sources||{};
      let contacts=[];
      Object.keys(ROLE_LABELS).forEach(k=>{
        const v = chair[k];
        if(v && !String(v).includes('UNCONFIRMED') && !String(v).includes('NEEDS')) contacts.push([ROLE_LABELS[k], v, null]);
      });
      (chair.related_officials||[]).forEach(ro=>{
        contacts.push([ro.role, ro.name, ro.href||null]);
      });
      const canonicalEntity = chair.bio_entity || name;
      contacts.forEach(([label,val,explicitHref])=>{
        const matched = Object.keys(bios).find(b=>val.includes(b)||b.includes(val));
        const href = explicitHref || (matched ? bioHref(name,matched,chair.bio_entity) : null);
        pushPerson({name:val, position:label, entity:canonicalEntity, href: href, source: matched?bioSrc[matched]:null, deloitte: findDeloitte(chair,val), linkedin: findLinkedIn(chair,val)});
      });
      (chair.board_members||[]).forEach(member=>{
        const matched = Object.keys(bios).find(b=>member.includes(b)||b.includes(member));
        pushPerson({name:member, position:'Board Member', entity:canonicalEntity, href: matched?bioHref(name,matched,chair.bio_entity):null, source: matched?bioSrc[matched]:null, deloitte: findDeloitte(chair,member), linkedin: findLinkedIn(chair,member)});
      });
    });
  });
  people.sort((a,b)=>a.name.localeCompare(b.name));
  return people;
}

function render(data){
  const people = buildPeople(data);
  const peopleRows = people.map(p=>{
    const bioCell = p.href ? `<a class="bio-link" href="${p.href}">Read bio →</a>` : `<span class="bio-no">pending</span>`;
    let deloitteCell, deloitteLinked=false;
    if(p.deloitte && p.deloitte.linked){
      deloitteLinked = true;
      deloitteCell = `<span class="deloitte-yes-badge" title="${esc(p.deloitte.note||'')}">Deloitte ↗</span>`;
    } else if(p.deloitte){
      deloitteCell = `<span class="deloitte-no-badge" title="${esc(p.deloitte.note||'')}">checked — none</span>`;
    } else {
      deloitteCell = `<span class="li-pending">—</span>`;
    }
    const searchBlob = esc((p.name+' '+p.position+' '+p.entity).toLowerCase());
    return `<tr data-search="${searchBlob}" data-deloitte="${deloitteLinked?'1':'0'}"><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${esc(p.entity)}</td><td>${bioCell}</td><td>${deloitteCell}</td></tr>`;
  }).join('');
  const deloitteLinkedCount = people.filter(p=>p.deloitte&&p.deloitte.linked).length;

  const html = `
<header><div class="eyebrow">Government of Malta</div><h1><span class="cross"></span>People Directory</h1><p class="sub">Every named official identified across Malta's ministries and officially appointed bodies, in one searchable list.</p><div class="meta-bar"><span><strong>${people.length}</strong> people identified</span><span><strong>${deloitteLinkedCount}</strong> with confirmed Deloitte links</span><span>Last updated <strong>${esc(data.updated)}</strong></span></div><a class="back" href="index.html">← Back to Ministries &amp; Entities</a></header>
<div class="people-directory"><div class="people-search-wrap"><input id="peopleSearch" type="text" placeholder="Search by name, role, or entity…" oninput="filterPeople()"><span class="deloitte-filter-wrap"><input type="checkbox" id="deloitteFilter" onchange="filterPeople()"><label for="deloitteFilter">Deloitte links only (${deloitteLinkedCount})</label></span><span id="peopleCount" class="people-count">${people.length} shown</span></div><table class="people-table"><thead><tr><th>Name</th><th>Position</th><th>Entity</th><th>Bio</th><th>Deloitte</th></tr></thead><tbody id="peopleTbody">${peopleRows}</tbody></table><p class="people-note">Open a person's bio for the specific article, profile, or official page each entry was researched from. Deloitte column: "Deloitte ↗" = confirmed link to Deloitte Malta (hover for detail); "checked — none" = individually verified with no link found; blank = not yet checked (${(data.deloitte_progress&&data.deloitte_progress.checked_count)||0} of ${(data.deloitte_progress&&data.deloitte_progress.total_bios)||478} people checked so far).</p></div>
<footer>Sources: Malta Data Portal (data.gov.mt AdminRegister API) · gov.mt Ministries &amp; Entities · Wikipedia · TVM News · Newsbook.<br><a href="index.html">← Back to Government of Malta — Structure Register</a></footer>`;
  document.getElementById('app').innerHTML = html;
}

function filterPeople(){
  const q = document.getElementById('peopleSearch').value.toLowerCase().trim();
  const deloitteOnly = document.getElementById('deloitteFilter') && document.getElementById('deloitteFilter').checked;
  let shown = 0;
  document.querySelectorAll('#peopleTbody tr').forEach(row=>{
    const textMatch = q.length===0 || row.dataset.search.includes(q);
    const deloitteMatch = !deloitteOnly || row.dataset.deloitte==='1';
    const match = textMatch && deloitteMatch;
    row.classList.toggle('hidden', !match);
    if(match) shown++;
  });
  document.getElementById('peopleCount').textContent = shown + ' shown';
}

fetch('/data.json').then(r=>r.json()).then(data=>{
  document.getElementById('loadingMsg').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  render(data);
}).catch(e=>{
  document.getElementById('loadingMsg').textContent = 'Failed to load data: '+e;
});
</script>
</body></html>
